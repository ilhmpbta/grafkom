<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cool Childhood Memento</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>

  <main class="app">
    <header class="app__header">
      <h1>Tugas 1 - Reproduksi Digital Clock Tower</h1>

    <section class="compare">
      <figure class="compare__panel">

      <figure class="compare__panel">

    <p class="app__hint"> Press <kbd>←</kbd> <kbd>→</kbd> or <kbd>↓</kbd> <kbd>↑</kbd> to rewind / advance time </p>
